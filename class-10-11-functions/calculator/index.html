<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Simple Calculator</title> 
 
  <script src="https://cdn.tailwindcss.com"></script> 
  <style> 
    
    button:active { 
      transform: scale(0.95); 
    } 
  </style> 
</head> 
<body class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen flex items-center 
justify-center p-4"> 
   
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-xs"> 
    <!-- Display --> 
    <div class="bg-gray-100 rounded-xl p-4 mb-4"> 
      <div id="display" class="text-right text-2xl font-mono text-gray-800 truncate h-8"> 
        0 
      </div> 
    </div> 
 
   
    <div class="grid grid-cols-4 gap-2"> 
      
      <button onclick="handleButton('√')" class="col-span-1 bg-amber-200 hover:bg-amber-300 
text-amber-900 font-bold py-3 rounded-lg transition text-sm">√</button> 
      <button onclick="handleButton('x^y')" class="bg-amber-200 hover:bg-amber-300 
text-amber-900 font-bold py-3 rounded-lg transition text-sm">x^y</button> 
      <button onclick="handleButton('!')" class="bg-amber-200 hover:bg-amber-300 
text-amber-900 font-bold py-3 rounded-lg transition text-sm">!</button> 
      <button onclick="handleButton('C')" class="bg-red-400 hover:bg-red-500 text-white font-bold 
py-3 rounded-lg transition">C</button> 
 
    
      <button onclick="handleButton('7')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">7</button> 
      <button onclick="handleButton('8')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">8</button> 
      <button onclick="handleButton('9')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">9</button> 
      <button onclick="handleButton('/')" class="bg-indigo-400 hover:bg-indigo-500 text-white 
font-bold py-3 rounded-lg transition">÷</button> 
 
      
      <button onclick="handleButton('4')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">4</button> 
      <button onclick="handleButton('5')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">5</button> 
      <button onclick="handleButton('6')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">6</button> 
      <button onclick="handleButton('*')" class="bg-indigo-400 hover:bg-indigo-500 text-white 
font-bold py-3 rounded-lg transition">×</button> 
 
     
      <button onclick="handleButton('1')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">1</button> 
      <button onclick="handleButton('2')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">2</button> 
      <button onclick="handleButton('3')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">3</button> 
      <button onclick="handleButton('-')" class="bg-indigo-400 hover:bg-indigo-500 text-white 
font-bold py-3 rounded-lg transition">−</button> 
 
     
      <button onclick="handleButton('0')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">0</button> 
      <button onclick="handleButton('.')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 
font-bold py-3 rounded-lg transition">.</button> 
      <button onclick="handleButton('=')" class="col-span-1 bg-green-400 hover:bg-green-500 
text-white font-bold py-3 rounded-lg transition">=</button> 
      <button onclick="handleButton('+')" class="bg-indigo-400 hover:bg-indigo-500 text-white 
font-bold py-3 rounded-lg transition">+</button> 
    </div> 
  </div> 
 
  <script src="index.js"></script> 
</body> 
</html>
