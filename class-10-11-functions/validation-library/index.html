<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Simple Validation Library</title> 
  
  <script src="https://cdn.tailwindcss.com"></script> 
</head> 
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen flex items-center 
justify-center p-4"> 
  <div class="bg-white rounded-2xl shadow-lg p-6 w-full max-w-md"> 
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">  Simple Validator</h1> 
 
   
    <div class="mb-4"> 
      <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label> 
      <input type="text" id="email" placeholder="user@example.com" 
             class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none 
focus:border-indigo-500 transition"> 
      <p id="emailError" class="text-sm mt-1 min-h-[20px]"></p> 
    </div> 
 
   
    <div class="mb-4"> 
      <label class="block text-sm font-semibold text-gray-700 mb-1">Phone (multiple 
formats)</label> 
      <input type="text" id="phone" placeholder="+1 (555) 123-4567 or 08065956974" 
             class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none 
focus:border-indigo-500 transition"> 
      <p id="phoneError" class="text-sm mt-1 min-h-[20px]"></p> 
    </div> 
 
   
    <div class="mb-4"> 
      <label class="block text-sm font-semibold text-gray-700 mb-1">Strong Password</label> 
      <input type="password" id="password" placeholder="Min 8 chars, upper, lower, digit, 
special" 
             class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none 
focus:border-indigo-500 transition"> 
      <p id="passwordError" class="text-sm mt-1 min-h-[20px]"></p> 
    </div> 
 

    <div class="mb-4"> 
      <label class="block text-sm font-semibold text-gray-700 mb-1">URL</label> 
      <input type="text" id="url" placeholder="https://example.com" 
             class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none 
focus:border-indigo-500 transition"> 
      <p id="urlError" class="text-sm mt-1 min-h-[20px]"></p> 
    </div> 
 
  
    <div class="mb-4"> 
      <label class="block text-sm font-semibold text-gray-700 mb-1">Date 
(YYYY-MM-DD)</label> 
      <input type="text" id="date" placeholder="2025-12-31" 
             class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none 
focus:border-indigo-500 transition"> 
      <p id="dateError" class="text-sm mt-1 min-h-[20px]"></p> 
    </div> 
  </div> 
 
  <script src="index.js"></script> 
</body> 
</html>
